name: OPC UA live integration

on:
  pull_request:
    paths:
      - "opcua/**"
      - "integration/opcua-live/**"
      - ".github/workflows/opcua-live.yml"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - "opcua/**"
      - "integration/opcua-live/**"
      - ".github/workflows/opcua-live.yml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  live-opcua:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/opcua-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: integration/opcua-live/go.sum
      - name: Verify module graph
        run: go mod tidy -diff
      - name: Test live OPC UA client/server path
        run: go test -race -count=1 -v ./...
